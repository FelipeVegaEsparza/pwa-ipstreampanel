server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Fallback SPA: todo lo que no es un archivo real sirve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # No cachear la API del panel ni datos dinámicos
    location ~* /api/ {
        add_header Cache-Control "no-store";
    }

    # Assets hasheados: caché larga
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /sw.js {
        add_header Cache-Control "no-cache";
    }
}
